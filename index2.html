<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>信奥训练助手 | Tiffany Blue</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/addon/edit/matchbrackets.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/dracula.css" />

<script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/clike/clike.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/addon/edit/matchbrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/addon/comment/comment.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
  background: linear-gradient(135deg, #d7f0ef 0%, #b4e0de 100%);
  color: #255;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 14px;
  gap: 12px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffff;
  padding: 12px 18px;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(120, 180, 178, 0.25);
}

.app-title {
  font-size: 20px;
  font-weight: 700;
  color: #0abab5;
}

.status-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-badge {
  padding: 7px 14px;
  border-radius: 999px;
  background: #e0f7f6;
  color: #1b7a76;
  font-weight: 600;
  font-size: 14px;
}

.status-badge.offline {
  background: #fde8e8;
  color: #b05050;
}

.btn-group {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 9px 18px;
  border: none;
  border-radius: 10px;
  background: #0abab5;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn:hover {
  background: #08a19c;
  transform: translateY(-1px);
}

.btn-secondary {
  background: #ffffff;
  color: #0abab5;
  border: 1px solid #0abab5;
}

.btn-secondary:hover {
  background: #e6f8f7;
}

.top-inputs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: #ffffff;
  padding: 12px 16px;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(120, 180, 178, 0.2);
}

.top-inputs input,
.top-inputs select {
  padding: 8px 12px;
  background: #f2faf9;
  border: 1px solid #aee2e0;
  border-radius: 8px;
  color: #255;
  font-size: 14px;
  outline: none;
}

.top-inputs input:focus,
.top-inputs select:focus {
  border-color: #0abab5;
  box-shadow: 0 0 0 3px rgba(10, 186, 181, 0.15);
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: #ffffff;
  padding: 12px 16px;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(120, 180, 178, 0.2);
}

.tag {
  padding: 8px 16px;
  border-radius: 999px;
  background: #e0f7f6;
  color: #1b7a76;
  cursor: pointer;
  user-select: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.tag:hover {
  background: #cbf1f0;
}

.tag.active {
  background: #0abab5;
  color: white;
}

.main-layout {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 12px;
  min-height: 0;
}

.panel {
  background: #ffffff;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(120, 180, 178, 0.2);
}

.panel-title {
  font-size: 16px;
  font-weight: 700;
  color: #0abab5;
  margin-bottom: 10px;
}

.textarea-box {
  flex: 1;
  background: #f2faf9;
  border: 1px solid #aee2e0;
  border-radius: 10px;
  padding: 12px;
  white-space: pre-wrap;
  overflow-y: auto;
  color: #255;
  font-size: 14px;
  outline: none;
}

.textarea-box:focus {
  border-color: #0abab5;
  box-shadow: 0 0 0 3px rgba(10, 186, 181, 0.15);
}

#codeEditor {
  flex: 1;
  height: auto;
  border-radius: 10px;
  overflow: hidden;
}

.record-panel {
  background: #ffffff;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 4px 14px rgba(120, 180, 178, 0.2);
}

.record-item {
  padding: 8px 0;
  border-bottom: 1px dashed #aee2e0;
  color: #466;
  font-size: 14px;
}

.current-stage-info {
  background: #e6f8f7;
  border-left: 4px solid #0abab5;
  padding: 10px 14px;
  border-radius: 10px;
  color: #1b7a76;
  font-size: 14px;
  margin-bottom: 10px;
}

@media (max-width: 900px) {
  .main-layout {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<header>
  <div class="app-title">信奥训练助手</div>
  <div class="status-area">
    <div id="ollamaStatus" class="status-badge">检测 Ollama...</div>
  </div>
  <div class="btn-group">
    <button class="btn" id="sendBtn">发送当前阶段请求</button>
    <button class="btn btn-secondary" id="saveBtn">保存本题记录</button>
  </div>
</header>

<div class="top-inputs">
  <input id="problemId" placeholder="题号" value="P1001" />
  <select id="sourceSel">
    <option value="luogu">洛谷</option>
    <option value="csp">CSP</option>
    <option value="gesp">GESP</option>
  </select>
  <select id="diffSel">
    <option value="easy">入门</option>
    <option value="mid">普及</option>
    <option value="hard">提高</option>
  </select>
  <input id="tagsInput" placeholder="知识点，逗号分隔" />
</div>

<div class="tag-row" id="stepTags"></div>

<div class="main-layout">
  <div class="panel">
    <div class="panel-title">题干粘贴区</div>
    <div id="problemText" class="textarea-box" contenteditable="true">在这里粘贴题目描述、样例输入输出、数据范围...</div>
  </div>

  <div class="panel">
    <div class="panel-title">代码编辑器</div>
    <div id="currentStageInfo" class="current-stage-info">当前阶段：读题拆解 —— 帮读懂题意、标出陷阱，但不给解法</div>
    <textarea id="codeEditor"></textarea>
  </div>
</div>

<div class="record-panel">
  <div class="panel-title">做题记录</div>
  <div id="recordList" style="margin-top:8px;"></div>
</div>

<script>
const OLLAMA_URL = "http://127.0.0.1:11434/api/generate";
const MODEL_NAME = "qwen2.5-coder:7b";

const STEP_INFO = [
  "读题拆解 —— 帮读懂题意、标出陷阱，但不给解法",
  "算法分析 —— 对比可行方案，引导选出最优算法",
  "代码框架 —— 搭建空白代码骨架，核心逻辑留白",
  "代码评审 —— 提交孩子代码，指出逻辑/结构问题，启发修改",
  "参考对比 —— 对照优秀AC代码，讲解差异",
  "复盘总结 —— 沉淀解题套路、坑点、简短笔记",
  "同类推荐 —— 给出洛谷同难度题号，过滤已做题目"
];

const SYSTEM_TEXT = "你是一名信奥竞赛教练，面向 GESP / CSP-J 的学生。严格按照阶段引导，禁止直接甩出完整AC代码，优先使用提问式启发引导学生自己发现问题。阶段顺序固定，学生没有完成当前阶段，绝不提前进入下一阶段。规则：1.【读题拆解】复述题意，标出数据范围、隐藏陷阱，抛出思考题，绝不透露解题方法。2.【算法分析阶段】学生给出自己的思路结果之后：先肯定合理部分；通过提问引导学生自查思路漏洞；对比2-3种可行方案，分析时间空间复杂度，引导学生选出最优算法，不要直接告诉正确算法。3.【代码框架阶段】学生写出自己框架后：先肯定做得好的地方；用提问找框架缺陷；指出边界、变量、循环等隐患；只在长时间卡壳时给出参考框架片段，不要直接贴完整正确代码。4.【代码评审阶段】学生提交完整代码：第一步先肯定代码优点；第二步定位问题，区分：思路错误/复杂度超时/边界bug（初值、下标、溢出、多组数据清空）；全部用提问引导修改，不直接输出修复后的完整代码。5.【参考对比阶段】给出规范竞赛AC代码，逐条对比学生代码差异，解释每种写法优劣。6.【复盘总结】提炼解题流程、高频坑点、简短记忆口诀。7.【同类推荐】给出洛谷题号，由易到难优先匹配相同知识点。学生跳阶段索要标准答案时，礼貌拒绝，把学生拉回当前阶段继续思考。";

let currentStep = 0;
let editor;

const tagWrap = document.getElementById("stepTags");
const stageInfo = document.getElementById("currentStageInfo");

STEP_INFO.forEach((item, idx) => {
  const d = document.createElement("div");
  d.className = "tag" + (idx === 0 ? " active" : "");
  d.innerText = item.split(" —— ")[0];
  d.onclick = () => {
    currentStep = idx;
    document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
    d.classList.add("active");
    stageInfo.innerText = "当前阶段：" + STEP_INFO[idx];
  };
  tagWrap.appendChild(d);
});

editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
  mode: "text/x-c++src",
  theme: "dracula",
  lineNumbers: true,
  matchBrackets: true,
  extraKeys: { "Ctrl-/": "toggleComment" }
});

editor.setValue(`// 在这里写你的代码...
#include <iostream>
using namespace std;

int main() {
    return 0;
}`);

async function checkOllama() {
  const el = document.getElementById("ollamaStatus");
  try {
    const res = await fetch("http://127.0.0.1:11434/api/tags");
    if (!res.ok) throw new Error();
    const json = await res.json();
    el.innerText = "Ollama 在线 · " + (json.models?.[0]?.name || MODEL_NAME);
    el.classList.remove("offline");
  } catch (e) {
    el.innerText = "Ollama 离线";
    el.classList.add("offline");
  }
}

checkOllama();
setInterval(checkOllama, 8000);

document.getElementById("sendBtn").onclick = async () => {
  const problem = document.getElementById("problemText").innerText.trim();
  const code = editor.getValue();
  const stageDesc = STEP_INFO[currentStep];

  const prompt = `【当前阶段】${stageDesc}
【题目】
${problem}
【学生代码】
${code}`;

  const fullPrompt = SYSTEM_TEXT + "\n\n" + prompt;

  try {
    const resp = await fetch(OLLAMA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL_NAME,
        prompt: fullPrompt,
        stream: true
      })
    });

    if (!resp.ok) {
      alert("请求失败，Ollama 返回错误");
      return;
    }

    alert("已发送当前阶段请求：" + stageDesc);
  } catch (err) {
    alert("网络异常，无法连接 Ollama");
  }
};

document.getElementById("saveBtn").onclick = () => {
  const pid = document.getElementById("problemId").value || "未命名题目";
  const recList = document.getElementById("recordList");
  const div = document.createElement("div");
  div.className = "record-item";
  div.innerHTML = `<strong>${pid}</strong> · ${new Date().toLocaleString()}`;
  recList.prepend(div);
};
</script>
</body>
</html>
